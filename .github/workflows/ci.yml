name: CI

# Runs the complete Cargo test suites on native Linux, Windows and macOS,
# Linux provider checks, xmlsec interoperability, SoftHSM2 and AWS-LC FIPS.
#
# Publishing to crates.io is manual for now: a Rhein Industries maintainer
# publishes the ten crates in dependency order from a tagged commit after this
# workflow passes. bergshamra's tag-triggered Publish workflow was removed in
# the fork: it used crates.io trusted publishing set up for the bergshamra
# crates, and ribergshamra has no trusted publisher configured yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. re-pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.runner }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
        profile: [default, legacy-rsa-decryption]
        include:
          - profile: default
            cargo_args: ''
          - profile: legacy-rsa-decryption
            cargo_args: --features legacy-rsa-decryption
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace ${{ matrix.cargo_args }} --all-targets -- -D warnings

      # No --lib filter: unit, binary, integration and documentation tests run.
      # SoftHSM tests remain ignored here and run in the isolated token job.
      # Unix descriptor/symlink tests are cfg(unix); native Windows exercises
      # its file policy, but does not close the documented non-Unix race limit.
      - name: cargo test (complete workspace suite)
        run: cargo test --locked --workspace ${{ matrix.cargo_args }}

      - name: cargo doc
        run: cargo doc --locked --workspace ${{ matrix.cargo_args }} --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  aws-lc:
    name: AWS-LC (Linux, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: complete
            features: aws-lc,legacy-algorithms,pkcs11
          - profile: legacy-rsa-feature-inert
            features: aws-lc,legacy-algorithms,pkcs11,legacy-rsa-decryption
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
          components: clippy

      - name: Install AWS-LC native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake clang libclang-dev perl pkg-config
      - name: Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo clippy
        run: cargo clippy --locked --workspace --no-default-features --features ${{ matrix.features }} --all-targets -- -D warnings
      - name: cargo test (complete workspace suite)
        run: cargo test --locked --workspace --no-default-features --features ${{ matrix.features }}
      - name: cargo doc
        run: cargo doc --locked --workspace --no-default-features --features ${{ matrix.features }} --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: AWS-LC excludes RustCrypto primitives
        run: |
          cargo tree --locked --workspace --no-default-features --features ${{ matrix.features }} -e normal --prefix none > /tmp/ribergshamra-aws-tree.txt
          forbidden='^(rsa|dsa|ecdsa|p256|p384|p521|ed25519-dalek|x25519-dalek|aes |aes-gcm|cbc |des |sha1 |sha2 |sha3 |hmac |ml-dsa|slh-dsa|ml-kem) v'
          if rg "$forbidden" /tmp/ribergshamra-aws-tree.txt; then
            echo "::error::AWS-LC build includes a RustCrypto primitive implementation"
            exit 1
          fi

      # The HSM integration target unconditionally imports the PKCS#11 API;
      # provider-only feature profiles therefore receive build checks here.
      - name: Minimal provider build checks
        run: |
          cargo check --locked --workspace --no-default-features --features rustcrypto
          cargo check --locked --workspace --no-default-features --features aws-lc

      - name: Invalid provider combinations fail closed
        run: |
          if cargo check --locked --workspace --no-default-features; then
            echo "::error::a document crypto provider is mandatory"
            exit 1
          fi
          if cargo check --locked --workspace --no-default-features --features rustcrypto,aws-lc; then
            echo "::error::multiple document providers must be rejected"
            exit 1
          fi
          if cargo check --locked --workspace --no-default-features --features legacy-rsa-decryption; then
            echo "::error::the RSA compatibility feature must not select a provider"
            exit 1
          fi

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cargo_args: ['', '--features legacy-rsa-decryption']
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: 1.88.0

      - name: Check workspace at MSRV
        run: cargo check --locked --workspace ${{ matrix.cargo_args }}

  xmlsec-interop:
    name: xmlsec interoperability (RustCrypto RSA legacy opt-in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Preserve historical DSig and XML Encryption parity with explicit RSA opt-in
        run: bash tests/run-provider-interop.sh

  softhsm:
    name: SoftHSM (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [rustcrypto, aws-lc]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install AWS-LC native build dependencies
        if: matrix.provider == 'aws-lc'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake clang libclang-dev perl pkg-config
      - name: Install SoftHSM and PKCS#11 tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes softhsm2 opensc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Initialize isolated token fixture
        run: bash hsm-test/setup.sh
      - name: Exercise token operations with selected document provider
        run: >-
          cargo test --locked -p ribergshamra-dsig --test hsm_sign_verify
          --no-default-features
          --features "${{ matrix.provider }},legacy-algorithms,pkcs11"
          -- --ignored --test-threads=1 --skip test_hsm_ed25519_sign_verify

  fips:
    name: FIPS document crypto (AWS-LC, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install AWS-LC native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake clang libclang-dev perl pkg-config
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Compile document provider in FIPS mode
        run: cargo check --locked --workspace --no-default-features --features fips,pkcs11
      - name: Verify explicit initialization and provider attestation
        run: cargo test --locked -p ribergshamra --no-default-features --features fips,pkcs11 --test fips_attestation
      - name: RustCrypto cannot be combined with FIPS
        run: |
          if cargo check --locked --workspace --no-default-features --features rustcrypto,fips; then
            echo "::error::FIPS unexpectedly compiled with RustCrypto document crypto"
            exit 1
          fi
