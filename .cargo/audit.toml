# cargo-audit allow-list.
#
# Each entry documents *why* the advisory is ignored, what the upstream
# fix looks like, and who has to move for ribergshamra to drop the entry.
# This file started as a mirror of kryptering's .cargo/audit.toml (now
# riptering's, Rhein Industries' maintained fork of kryptering) — we carry
# the unresolved RSA advisory that also flows through riptering. Patched
# advisory entries are removed instead of retained as broad exceptions.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — RustCrypto RSA timing side channel.
    # Rechecked 2026-09-26: no patched version, including the 0.10
    # prerelease line. Blinding and the bigint migration are not closure.
    # RustCrypto RSA decryption is refused by default. The separate
    # legacy-rsa-decryption compatibility opt-in retains the timing risk;
    # signing timing assurance also remains unresolved. This exception records
    # unresolved risk; passing cargo-audit does not establish remediation.
    # Upstream: https://github.com/RustCrypto/RSA/issues/626
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0097 is patched in rand >= 0.8.6. This workspace locks
    # rand 0.8.8, so the old rand advisory exception has been removed.

    # Note — ml-dsa advisory posture:
    # RUSTSEC-2025-0144 (timing side-channel in ML-DSA decomposition, fixed
    # by replacing hardware division with constant-time Barrett reduction)
    # is patched in ml-dsa >= 0.1.0-rc.3. ribergshamra depends on ml-dsa 0.1.1
    # in the workspace Cargo.toml, so this advisory does not fire against
    # our Cargo.lock and needs no ignore entry. Revisit only if ml-dsa
    # is pinned backward.
    # Upstream: https://github.com/RustCrypto/signatures/security/advisories/GHSA-hcp2-x6j4-29j7
]
