[package]
name = "ribergshamra-transforms"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ribergshamra-transforms"
readme.workspace = true
rust-version.workspace = true
description = "Transform pipeline for ribergshamra, the maintained fork of the bergshamra XML Security library"

[features]
default = ["rustcrypto", "legacy-algorithms", "post-quantum", "pkcs11"]
rustcrypto = ["ribergshamra-crypto/rustcrypto", "ribergshamra-keys/rustcrypto"]
aws-lc = ["ribergshamra-crypto/aws-lc", "ribergshamra-keys/aws-lc"]
fips = ["aws-lc", "ribergshamra-crypto/fips", "ribergshamra-keys/fips"]
legacy-algorithms = ["ribergshamra-crypto/legacy-algorithms", "ribergshamra-keys/legacy-algorithms"]
post-quantum = ["ribergshamra-crypto/post-quantum", "ribergshamra-keys/post-quantum"]
pkcs11 = ["ribergshamra-crypto/pkcs11", "ribergshamra-keys/pkcs11"]

[dependencies]
ribergshamra-core.workspace = true
ribergshamra-xml.workspace = true
ribergshamra-c14n.workspace = true
ribergshamra-crypto.workspace = true
ribergshamra-keys.workspace = true
base64.workspace = true
uppsala.workspace = true
