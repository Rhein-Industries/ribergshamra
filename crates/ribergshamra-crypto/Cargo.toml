[package]
name = "ribergshamra-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ribergshamra-crypto"
readme.workspace = true
rust-version.workspace = true
description = "Cryptographic algorithm implementations for ribergshamra, the maintained fork of the bergshamra XML Security library"

[features]
default = ["rustcrypto", "legacy-algorithms", "post-quantum"]
rustcrypto = ["riptering/rustcrypto"]
aws-lc = ["riptering/aws-lc"]
fips = ["aws-lc", "riptering/fips"]
legacy-algorithms = ["riptering/legacy"]
post-quantum = ["riptering/post-quantum"]
pkcs11 = ["riptering/pkcs11"]

[dependencies]
ribergshamra-core.workspace = true
riptering.workspace = true

[dev-dependencies]
hex = "0.4"
rand.workspace = true
rsa.workspace = true
x25519-dalek.workspace = true
